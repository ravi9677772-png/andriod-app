<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brainvita Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
    .stats {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      margin-bottom: 12px;
    }
    .stat { text-align: center; }
    .stat-label { font-size: 0.65rem; color: #94a3b8; font-weight: bold; }
    .stat-val { font-size: 1.1rem; font-weight: 800; color: #f8fafc; }
    #board-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #064e3b;
    }
    .controls {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 6px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #334155; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #hint-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
      text-align: center;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .modal-card h2 { color: #4ade80; margin-bottom: 8px; }
    .modal-card button { width: 100%; margin-top: 16px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Brainvita Master</h1>
    <button id="btn-sound" onclick="toggleSound()">🔊</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">PEGS</div><div class="stat-val" id="st-pegs" style="color:#38bdf8">32</div></div>
    <div class="stat"><div class="stat-label">REMOVED</div><div class="stat-val" id="st-removed">0</div></div>
    <div class="stat"><div class="stat-label">MOVES</div><div class="stat-val" id="st-moves">0</div></div>
    <div class="stat"><div class="stat-label">TIME</div><div class="stat-val" id="st-time">00:00</div></div>
  </div>

  <div id="board-container">
    <canvas id="canvas" width="600" height="600"></canvas>
  </div>

  <div id="hint-msg"></div>

  <div class="controls">
    <button id="btn-undo" onclick="undoMove()" disabled>Undo</button>
    <button onclick="requestHint()">Hint</button>
    <button onclick="restartGame()">Restart</button>
    <button onclick="newGame()">New Game</button>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <h2 id="modal-title">Game Over</h2>
      <p id="modal-desc" style="margin-bottom:8px"></p>
      <div id="modal-score" style="color:#94a3b8; font-size:0.9rem"></div>
      <button onclick="newGame(); closeModal();">Play Again</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer (Zero asset dependencies)
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let soundOn = true;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (!soundOn || ctx.state === 'suspended') ctx.resume();
      if (!soundOn) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }
    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('btn-sound').innerText = soundOn ? '🔊' : '🔇';
    }

    // Board Definition: 33 Holes
    const VALID_HOLES = new Set();
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 7; c++) {
        if ((r >= 2 && r <= 4) || (c >= 2 && c <= 4)) {
          VALID_HOLES.add(`${r},${c}`);
        }
      }
    }

    let board = {};
    let history = [];
    let selectedPos = null;
    let validTargets = [];
    let hintMove = null;
    let timer = null;
    let seconds = 0;

    function initBoard() {
      board = {};
      VALID_HOLES.forEach(k => board[k] = true);
      board['3,3'] = false; // Empty center hole
      history = [];
      selectedPos = null;
      validTargets = [];
      hintMove = null;
      seconds = 0;
      clearInterval(timer);
      timer = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        document.getElementById('st-time').innerText = `${m}:${s}`;
      }, 1000);
      updateStats();
      draw();
    }

    function getDestinations(r, c) {
      if (!board[`${r},${c}`]) return [];
      const dirs = [[-2,0],[2,0],[0,-2],[0,2]];
      const dests = [];
      for (const [dr, dc] of dirs) {
        const tr = r + dr, tc = c + dc;
        const mr = r + dr / 2, mc = c + dc / 2;
        if (VALID_HOLES.has(`${tr},${tc}`) && !board[`${tr},${tc}`] && board[`${mr},${mc}`]) {
          dests.push({ r: tr, c: tc, jumped: { r: mr, c: mc } });
        }
      }
      return dests;
    }

    function getAllMoves() {
      const moves = [];
      VALID_HOLES.forEach(k => {
        if (board[k]) {
          const [r, c] = k.split(',').map(Number);
          getDestinations(r, c).forEach(d => moves.push({ from: { r, c }, to: { r: d.r, c: d.c }, jumped: d.jumped }));
        }
      });
      return moves;
    }

    function handleTap(r, c) {
      const key = `${r},${c}`;
      if (!VALID_HOLES.has(key)) return;

      if (!selectedPos) {
        if (board[key]) {
          const targets = getDestinations(r, c);
          if (targets.length) {
            selectedPos = { r, c };
            validTargets = targets;
            playBeep(650);
          } else {
            playBeep(200, 'square');
          }
        }
      } else {
        if (selectedPos.r === r && selectedPos.c === c) {
          selectedPos = null;
          validTargets = [];
        } else if (board[key]) {
          const targets = getDestinations(r, c);
          selectedPos = { r, c };
          validTargets = targets;
          playBeep(650);
        } else {
          const move = validTargets.find(t => t.r === r && t.c === c);
          if (move) {
            history.push({
              from: { ...selectedPos },
              jumped: { ...move.jumped },
              to: { r, c }
            });
            board[`${selectedPos.r},${selectedPos.c}`] = false;
            board[`${move.jumped.r},${move.jumped.c}`] = false;
            board[`${r},${c}`] = true;
            playBeep(450, 'triangle', 0.12);

            selectedPos = null;
            validTargets = [];
            hintMove = null;
            document.getElementById('hint-msg').innerText = '';
            checkStatus();
          } else {
            playBeep(200, 'square');
          }
        }
      }
      updateStats();
      draw();
    }

    function undoMove() {
      if (!history.length) return;
      const last = history.pop();
      board[`${last.to.r},${last.to.c}`] = false;
      board[`${last.jumped.r},${last.jumped.c}`] = true;
      board[`${last.from.r},${last.from.c}`] = true;
      selectedPos = null;
      validTargets = [];
      hintMove = null;
      playBeep(350);
      updateStats();
      draw();
    }

    function requestHint() {
      const moves = getAllMoves();
      if (!moves.length) {
        document.getElementById('hint-msg').innerText = 'No valid moves available!';
        playBeep(200, 'square');
        return;
      }
      hintMove = moves[0];
      selectedPos = hintMove.from;
      validTargets = [hintMove];
      document.getElementById('hint-msg').innerText = `Jump from (${hintMove.from.r+1},${hintMove.from.c+1}) to (${hintMove.to.r+1},${hintMove.to.c+1})`;
      playBeep(750);
      draw();
    }

    function updateStats() {
      const count = Object.values(board).filter(Boolean).length;
      document.getElementById('st-pegs').innerText = count;
      document.getElementById('st-removed').innerText = 32 - count;
      document.getElementById('st-moves').innerText = history.length;
      document.getElementById('btn-undo').disabled = history.length === 0;
    }

    function checkStatus() {
      const count = Object.values(board).filter(Boolean).length;
      const moves = getAllMoves();
      if (moves.length === 0) {
        clearInterval(timer);
        let title = "Game Over";
        let rating = "Keep Practising";
        if (count === 1) { title = "🏆 Genius!"; rating = "Master of Brainvita!"; }
        else if (count === 2) { title = "Excellent!"; rating = "Outstanding performance!"; }
        else if (count === 3) { title = "Very Good!"; rating = "Great game!"; }
        else if (count <= 6) { title = "Good Effort!"; rating = "Solid play!"; }

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = rating;
        document.getElementById('modal-score').innerText = `Pegs: ${count} | Moves: ${history.length} | Time: ${document.getElementById('st-time').innerText}`;
        document.getElementById('modal').style.display = 'flex';
      }
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function restartGame() { initBoard(); }
    function newGame() { initBoard(); }

    // Canvas Drawing
    const canvas = document.getElementById('canvas');
    const g = canvas.getContext('2d');
    function draw() {
      const w = canvas.width;
      const cell = w / 7;
      g.clearRect(0, 0, w, w);

      // Outer Wood Board Ring
      g.beginPath();
      g.arc(w/2, w/2, w/2 - 4, 0, Math.PI*2);
      g.fillStyle = '#064e3b';
      g.fill();
      g.lineWidth = 8;
      g.strokeStyle = '#1e293b';
      g.stroke();

      VALID_HOLES.forEach(k => {
        const [r, c] = k.split(',').map(Number);
        const cx = c * cell + cell / 2;
        const cy = r * cell + cell / 2;
        const hasPeg = board[k];
        const isSel = selectedPos && selectedPos.r === r && selectedPos.c === c;
        const isTarget = validTargets.some(t => t.r === r && t.c === c);

        // Draw Hole
        g.beginPath();
        g.arc(cx, cy, cell * 0.38, 0, Math.PI*2);
        g.fillStyle = '#090d16';
        g.fill();
        g.lineWidth = 2;
        g.strokeStyle = '#334155';
        g.stroke();

        if (isTarget) {
          g.beginPath();
          g.arc(cx, cy, cell * 0.38, 0, Math.PI*2);
          g.strokeStyle = '#4ade80';
          g.lineWidth = 5;
          g.stroke();
        }

        // Draw Peg
        if (hasPeg) {
          g.beginPath();
          const rad = cell * 0.34;
          g.arc(cx, cy, rad, 0, Math.PI*2);
          const grad = g.createRadialGradient(cx - rad*0.3, cy - rad*0.3, rad*0.2, cx, cy, rad);
          if (isSel) {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, '#0284c7');
          } else {
            grad.addColorStop(0, '#fffbeb');
            grad.addColorStop(0.7, '#fde68a');
            grad.addColorStop(1, '#d97706');
          }
          g.fillStyle = grad;
          g.fill();
          if (isSel) {
            g.strokeStyle = '#38bdf8';
            g.lineWidth = 4;
            g.stroke();
          }
        }
      });
    }

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const x = (e.clientX - rect.left) * scale;
      const y = (e.clientY - rect.top) * scale;
      const cell = canvas.width / 7;
      const col = Math.floor(x / cell);
      const row = Math.floor(y / cell);
      handleTap(row, col);
    });

    initBoard();
  </script>
</body>
</html>
